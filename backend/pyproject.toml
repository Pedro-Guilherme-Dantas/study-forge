[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "studyforge"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.162.0", "pydantic==2.14.1", "pydantic-settings>=2.10,<3",
  "SQLAlchemy[asyncio]==2.1.6", "psycopg[binary]==3.3.6", "alembic==1.20.1",
  "pgvector==0.5.1", "uvicorn>=0.35,<1", "python-multipart>=0.0.20,<1",
  "langchain==1.4.7", "langgraph==1.2.18", "langchain-google-genai==4.4.2",
  "google-genai==2.33.0", "httpx==0.28.1", "httpcore==1.0.9",
  "trafilatura==2.3.1", "markdown-it-py==4.2.0", "regex==2026.9.29",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
  "unit: isolated deterministic checks",
  "contract: HTTP contract and security checks",
  "integration: PostgreSQL and application integration",
  "external: explicit opt-in calls with authorized evaluation fixtures",
]
